name: Release

# Stages the package on npm when a GitHub release is published (a plain tag does not stage anything). The version becomes
# public only after a maintainer approves it with 2FA, on npmjs.com in the Staged Packages tab or with
# `npm stage approve <stage-id>`. It uses npm trusted publishing (OIDC), so no token is stored: on npmjs.com, the package
# has this repository and this workflow file as its trusted publisher, allowed to stage only. A version that is already
# on npm (for example published by hand) is skipped.

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write # npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  package-manager-cache: false # no cache in release builds
                  registry-url: https://registry.npmjs.org
            - name: The tag matches the version in package.json
              run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
            - name: Skip a version that is already on npm
              id: published
              run: |
                  if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: steps.published.outputs.skip != 'true'
              run: npm install --global npm@latest # staged publishing needs npm 11.15 or later
            - if: steps.published.outputs.skip != 'true'
              run: npm ci
            - if: steps.published.outputs.skip != 'true'
              run: npm stage publish --provenance --access public

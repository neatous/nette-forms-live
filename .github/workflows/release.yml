name: Release

# Publishes the package to npm when a GitHub release is published (a plain tag does not publish anything). It uses npm
# trusted publishing (OIDC), so no token is stored: on npmjs.com, the package must have this repository and this
# workflow file set as its trusted publisher. A version that is already on npm (for example published by hand) is
# skipped.

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write # npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org
            - name: The tag matches the version in package.json
              run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
            - name: Skip a version that is already on npm
              id: published
              run: |
                  if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: steps.published.outputs.skip != 'true'
              run: npm install --global npm@latest # trusted publishing needs a recent npm CLI
            - if: steps.published.outputs.skip != 'true'
              run: npm ci
            - if: steps.published.outputs.skip != 'true'
              run: npm publish --provenance --access public

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nette-forms-live with flatpickr and validateOn.blur always</title>
    <link rel="stylesheet" href="/node_modules/flatpickr/dist/flatpickr.min.css">
    <style>
        body { font: 16px sans-serif; margin: 20px; }
        .invalid-feedback { display: none; color: #dc3545; }
        .d-block { display: block; }
    </style>
</head>
<body>
<input id="outside" aria-label="Outside">
<form id="form" action="#" method="post">
    <div class="field">
        <input name="date" id="date" data-nette-rules='[{"op":":filled","msg":"Choose a date"}]'>
    </div>
    <div class="field">
        <input name="name" id="name" data-nette-rules='[{"op":":filled","msg":"Name is required"}]'>
    </div>
    <div class="field"><input name="note" id="note"></div>
    <button type="submit" id="submit">Save</button>
</form>
<form id="form-ro" action="#" method="post">
    <div class="field">
        <input name="ro" id="ro" data-nette-rules='[{"op":":filled","msg":"Choose a read-only date"}]'>
    </div>
    <button type="submit" id="submit-ro">Save</button>
</form>
<script src="/node_modules/nette-forms/src/assets/netteForms.js"></script>
<script src="/node_modules/flatpickr/dist/flatpickr.min.js"></script>
<script src="/dist/nette-forms-live.js"></script>
<script>
    NetteFormsLive.install(Nette, { validateOn: { change: true, blur: 'always', input: 'recheck' } });
    flatpickr('#date', { altInput: true, altFormat: 'j. n. Y', dateFormat: 'Y-m-d', disableMobile: true, allowInput: true });
    flatpickr('#ro', { altInput: true, altFormat: 'j. n. Y', dateFormat: 'Y-m-d', disableMobile: true });
    document.addEventListener('submit', (event) => event.preventDefault());
</script>
</body>
</html>
